services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce # local only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: